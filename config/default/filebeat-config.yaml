apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: namespace-label-system
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: container
        enabled: true
        paths:
          - /var/log/containers/*namespace-label-system_manager*.log
        processors:
          - add_kubernetes_metadata:
              in_cluster: true
    
    output.elasticsearch:
      hosts: ["https://namespace-label-es-http.default.svc.cluster.local:9200"]
      username: "elastic"
      password: "W68Ad2OX26gaI8Y03IKW2LP6"
      index: "filebeat-kubebuilder"
      ssl.verification_mode: none

    setup.template.name: "filebeat-kubebuilder"
    setup.template.pattern: "filebeat-kubebuilder-*"
    setup.ilm.enabled: false
    
    logging.level: info
